server:
  port: 8080

spring:
  application:
    name: enterprise-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${DB_NAME:enterprise_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: >-
      classpath:db/migration,
      classpath:db/migration/organization,
      classpath:db/migration/workflow,
      classpath:db/migration/notification,
      classpath:db/migration/attendance,
      classpath:db/migration/leave,
      classpath:db/migration/pos/product,
      classpath:db/migration/pos/core,
      classpath:db/migration/pos/payment,
      classpath:db/migration/pos/tax,
      classpath:db/migration/pos/inventory,
      classpath:db/migration/pos/staff,
      classpath:db/migration/pos/crm,
      classpath:db/migration/pos/promotion
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567843b12f12}
  expiration: ${JWT_EXPIRATION:900000}

modules:
  auth: true
  organization: true
  workflow: true
  notification: false
  attendance: false
  product: true
  pos-core: true
  pos-payment: true
  pos-tax: true
  pos-inventory: true
  pos-staff: true
  pos-crm: true
  pos-promotion: true
  leave: true
  finance: false

pos:
  invoice:
    seller-id: ${POS_SELLER_ID:12345678}
    seller-name: ${POS_SELLER_NAME:企業商店}
  auth:
    pin-login: true
    quick-switch: true
    auto-lock-minutes: 5
    manager-override: true
  organization:
    multi-region: true
    multi-store: true
    terminal-monitor: true
  inventory:
    multi-store-sync: true
    bopis: false
    batch-tracking: false
    serial-tracking: false
    auto-reorder: true
    inter-store-transfer: true
  staff:
    blind-close-enabled: true
    x-report-enabled: true
    z-report-enabled: true
    swap-request-enabled: true
